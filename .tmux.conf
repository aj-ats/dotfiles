# put this file @ ~
# set tabs to num 1 instead of 0 start index
set -g base-index 1
# vim navigation
set -g mode-keys vi
# some shit idk
set -g default-terminal "screen-256color"
set -g terminal-overrides ",xterm-256color:Tc"

# set git branch status bar
set -g status-right '#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD)'
#set -g status-right '#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD) | #{cpu_icon} #{cpu_percentage}'

# Plugins 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
run '~/.tmux/plugins/tpm/tpm'
